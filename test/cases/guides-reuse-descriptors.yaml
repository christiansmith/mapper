# Runnable examples in the reuse-descriptors guide. Change-together rule:
# page and cases change in the same commit.
page: src/content/docs/guides/reuse-descriptors.md
cases:
  - name: each with a $ref applies a registered mapping per element
    mappings:
      'mapping:Person':
        $id: 'mapping:Person'
        source: /
        mapping:
          /name: /fullName
          /email: /email
    mapping:
      /team:
        source: /members
        each:
          $ref: 'mapping:Person'
    input:
      members:
        - { fullName: Grace Hopper, email: grace@example.com }
        - { fullName: Emmy Noether, email: emmy@example.com }
    output:
      team:
        - { name: Grace Hopper, email: grace@example.com }
        - { name: Emmy Noether, email: emmy@example.com }

  - name: $extend inherits the ancestor's pairings
    mappings:
      'mapping:Person':
        $id: 'mapping:Person'
        source: /
        mapping:
          /name: /fullName
          /email: /email
      'mapping:Employee':
        $id: 'mapping:Employee'
        $extend: 'mapping:Person'
        source: /
        mapping:
          /badge: /badgeId
    mapping:
      $ref: 'mapping:Employee'
    input:
      fullName: Grace Hopper
      email: grace@example.com
      badgeId: E-1906
    output:
      name: Grace Hopper
      email: grace@example.com
      badge: E-1906


  - name: $extend merges a list of ancestors in order
    mappings:
      'mapping:Person':
        $id: 'mapping:Person'
        source: /
        mapping:
          /name: /fullName
          /email: /email
      'mapping:Contact':
        $id: 'mapping:Contact'
        source: /
        mapping:
          /phone: /phone
      'mapping:Employee':
        $id: 'mapping:Employee'
        $extend: ['mapping:Person', 'mapping:Contact']
        source: /
        mapping:
          /badge: /badgeId
    mapping:
      $ref: 'mapping:Employee'
    input:
      fullName: Grace Hopper
      email: grace@example.com
      phone: 555-1906
      badgeId: E-1906
    output:
      name: Grace Hopper
      email: grace@example.com
      phone: 555-1906
      badge: E-1906
